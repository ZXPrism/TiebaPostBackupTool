<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度贴吧贴子备份工具</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <main>
        <header><span class="eyebrow">Tieba Post Backup Tool</span><h1>百度贴吧贴子备份工具</h1><p>输入帖子链接，查找已有备份，也可以保存一份新的备份。</p></header>
        <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">查找帖子备份</h2>
            <form id="backup-form">
                <label for="post-url">帖子链接或 ID</label>
                <div class="input-row"><input id="post-url" name="url" placeholder="https://tieba.baidu.com/p/…" required autocomplete="off"><button id="submit" type="submit">查询备份 <span aria-hidden="true">→</span></button></div>
                <p class="hint">查询不会自动开始备份。关闭页面后，重新输入原链接即可查询结果。</p>
            </form>
            <p id="message" role="status" aria-live="polite"></p>
        </section>
        <section id="results" aria-labelledby="results-title" hidden>
            <div class="section-heading"><h2 id="results-title"></h2><span id="connection"></span></div>
            <div class="backup-action"><button id="start-backup" type="button">开始备份</button><p id="last-failure" class="hint" hidden>上次未能生成备份，可以重新开始。</p></div>
            <div id="active-backup" class="panel" role="status" hidden></div>
            <h3 class="backups-heading">已有备份</h3>
            <div id="backups"></div>
        </section>
        <footer>备份包含帖子数据、图片和离线阅读页面。下载 TAR 后解压，打开 viewer.html 即可阅读。</footer>
    </main>
</body>
</html>
